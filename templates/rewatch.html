<!DOCTYPE html>

<html>

<head>
    <title>Rewatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #E8334A;
            --orange: #F26C3A;
            --pink:   #F0456A;
            --grad:   linear-gradient(135deg, #E8334A 0%, #F26C3A 55%, #F0456A 100%);
            --bg:     #0f0a0b;
            --surface:#1a1014;
            --card:   #221519;
            --border: rgba(240,69,106,0.12);
            --muted:  #9a7f84;
            --text:   #f5e8ea;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 40px;
        }
        body::after {
            content: '';
            position: fixed;
            top: -20vh; left: 50%;
            transform: translateX(-50%);
            width: 80vw; height: 50vh;
            background: radial-gradient(ellipse, rgba(232,51,74,0.1) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: transparent;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .top-bar a { color: var(--muted); text-decoration: none; font-size: 14px; transition: color 0.15s; }
        .top-bar a:hover { color: var(--text); }
        .movie-row { display: flex; gap: 28px; align-items: flex-start; }
        .movie-poster { width: 150px; flex: 0 0 150px; }
        .movie-poster img { width: 100%; border-radius: 10px; display: block; box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--border); }
        h1 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 4px;
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
        }
        .rewatch-badge-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            background: var(--card);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 8px;
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        form { margin-top: 18px; }
        textarea {
            width: 100%;
            min-height: 160px;
            margin-top: 12px;
            padding: 16px;
            background: var(--card);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            resize: vertical;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
            line-height: 1.6;
        }
        textarea:focus { border-color: rgba(232,51,74,0.5); box-shadow: 0 0 0 3px rgba(232,51,74,0.07); }
        textarea::placeholder { color: var(--muted); }
        .controls { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
        .star-group { display: inline-flex; gap: 6px; }
        .star-btn {
            appearance: none;
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: 20px;
            width: 42px; height: 42px;
            border-radius: 9px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all .14s;
        }
        .star-btn:hover { transform: translateY(-2px); color: var(--text); border-color: rgba(232,51,74,0.3); }
        .star-btn.active { color: var(--orange); border-color: rgba(232,51,74,0.3); background: rgba(232,51,74,0.08); }
        select { display: none; }
        .heart-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px; height: 42px;
            border-radius: 9px;
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            transition: all .14s ease;
        }
        .heart-btn:hover { transform: translateY(-2px); border-color: rgba(232,51,74,0.3); }
        .heart-btn.liked { color: var(--red); background: rgba(232,51,74,0.08); border-color: rgba(232,51,74,0.3); box-shadow: 0 4px 14px rgba(232,51,74,0.12); }
        .submit-btn {
            margin-left: auto;
            padding: 10px 22px;
            border-radius: 9px;
            background: var(--grad);
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: opacity 0.15s, transform 0.1s;
        }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .muted { color: var(--muted); font-size: 13px; }
    </style>
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <a href="/movie/{{ movie.id }}">← Back</a>
            <div>
                {% if session.get('user_id') %}
                    <a href="/profile">Profile</a>
                {% else %}
                    <a href="/login">Login</a>
                {% endif %}
            </div>
        </div>

        <div class="movie-row">
            <div class="movie-poster">
                <img src="{{ movie.poster }}" alt="{{ movie.title }} poster">
            </div>
            <div style="flex:1">
                <h1>{{ movie.title }}</h1>
                <div class="rewatch-badge-inline">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.1"/><path d="M21 3v6h-6"/></svg>
                    Rewatch
                </div>
                <div class="muted">Create a new diary entry for this rewatch</div>

                <form method="POST" action="/save_rewatch/{{ movie.id }}">

                    <textarea name="review" placeholder="Write your thoughts about this rewatch..."></textarea>

                    <div class="controls">
                        <label class="muted">Rating</label>
                        <input type="hidden" name="rating" id="rating-input" value="">
                        <div class="star-group" id="star-group" aria-label="Rating">
                            <button type="button" class="star-btn" data-value="1" title="1 star">★</button>
                            <button type="button" class="star-btn" data-value="2" title="2 stars">★</button>
                            <button type="button" class="star-btn" data-value="3" title="3 stars">★</button>
                            <button type="button" class="star-btn" data-value="4" title="4 stars">★</button>
                            <button type="button" class="star-btn" data-value="5" title="5 stars">★</button>
                        </div>

                        <input type="hidden" name="liked" id="liked-input" value="">

                        <button type="button" id="like-btn" class="heart-btn" aria-pressed="false" title="Like">
                            ❤️
                        </button>

                        <button type="submit" class="submit-btn">Save Rewatch</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const likeBtn = document.getElementById('like-btn');
            const likedInput = document.getElementById('liked-input');
            const starGroup = document.getElementById('star-group');
            const ratingInput = document.getElementById('rating-input');

            if(likeBtn && likedInput){
                function setLikedState(on){
                    if(on){ likeBtn.classList.add('liked'); likeBtn.setAttribute('aria-pressed','true'); likedInput.value = 'on'; }
                    else { likeBtn.classList.remove('liked'); likeBtn.setAttribute('aria-pressed','false'); likedInput.value = ''; }
                }
                setLikedState(false);
                likeBtn.addEventListener('click', function(){ setLikedState(likedInput.value !== 'on'); });
            }

            if(starGroup && ratingInput){
                const stars = Array.from(starGroup.querySelectorAll('.star-btn'));
                function applyRating(val){
                    stars.forEach(s => {
                        const v = parseInt(s.getAttribute('data-value'),10);
                        if(v <= val) s.classList.add('active'); else s.classList.remove('active');
                    });
                    ratingInput.value = val ? String(val) : '';
                }
                applyRating(0);
                stars.forEach(star => {
                    star.addEventListener('click', function(){
                        applyRating(parseInt(this.getAttribute('data-value'),10));
                    });
                });
            }
        })();
    </script>

</body>

</html>
