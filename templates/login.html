<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #E8334A;
            --orange: #F26C3A;
            --pink:   #F0456A;
            --grad:   linear-gradient(135deg, #E8334A 0%, #F26C3A 55%, #F0456A 100%);
            --bg:     #0f0a0b;
            --surface:#1a1014;
            --card:   #221519;
            --border: rgba(240,69,106,0.12);
            --muted:  #9a7f84;
            --text:   #f5e8ea;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        body::after {
            content: '';
            position: fixed;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(232,51,74,0.14) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            background: var(--card);
            padding: 40px;
            border-radius: 18px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 32px;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
            display: block;
            letter-spacing: -1px;
        }
        h2 {
            margin: 0 0 24px 0;
            font-size: 16px;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 13px 16px;
            margin: 6px 0;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        input:focus {
            border-color: rgba(232,51,74,0.5);
            box-shadow: 0 0 0 3px rgba(232,51,74,0.08);
        }
        input::placeholder { color: var(--muted); }
        button {
            width: 100%;
            padding: 13px;
            background: var(--grad);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.3px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        a {
            color: var(--muted);
            font-size: 14px;
            display: block;
            margin-top: 16px;
            text-decoration: none;
            transition: color 0.15s;
        }
        a:hover { color: var(--text); }
        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--muted);
            text-decoration: none;
            background: var(--surface);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            border: 1px solid var(--border);
            transition: border-color 0.15s;
        }
        .back-home:hover { border-color: rgba(232,51,74,0.3); color: var(--text); }
        .flash { margin-bottom: 14px; }
        .flash-item {
            background: rgba(232,51,74,0.08);
            border-left: 3px solid var(--red);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            text-align: left;
        }
        .top-right {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 100;
        }
        .top-right a {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            display: inline-block;
            margin: 0;
        }
        .top-right a:hover { border-color: rgba(232,51,74,0.4); }
    </style>
</head>
<body>

<div class="top-right">
    {% if session.get('user_id') %}
        <a href="/profile">Profile</a>
    {% else %}
        <a href="/login">Login</a>
    {% endif %}
</div>

<div class="container">
    <a href="/" class="back-home">← Home</a>
    <span class="logo">MovieLand.</span>
    <h2>Sign in to your account</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash" id="flash-block">
                {% for m in messages %}
                    <div class="flash-item">{{ m }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a href="/register">Don't have an account? Create one</a>
</div>

</body>
</html>
